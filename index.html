<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MotoFare Kigali — Fair Ride Prices</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🏍️</span>
        <div>
          <span class="logo-text">MotoFare</span>
          <span class="logo-sub">Kigali</span>
        </div>
      </div>
      <div class="header-right">
        <p class="tagline">Know the fair price before you ride.</p>
      </div>
    </div>
    <div class="header-stripe"></div>
  </header>

  <main>

    <!-- Quick Routes Section -->
    <section class="section" id="quick-routes">
      <div class="section-label">⚡ Fixed Fair Routes for Rwandan community &amp; Students</div>
      <p class="section-desc">Community-verified fair prices for common student routes. Click "Use this route" to fill the estimator below.</p>

      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All Routes</button>
        <button class="filter-btn" data-filter="cheap">Under 1000 RWF</button>
        <button class="filter-btn" data-filter="medium">1000–2000 RWF</button>
        <button class="filter-btn" data-filter="far">2000+ RWF</button>
        <div class="sort-group">
          <label>Sort by:</label>
          <select id="sortSelect">
            <option value="default">Default</option>
            <option value="price-asc">Price ↑</option>
            <option value="price-desc">Price ↓</option>
            <option value="distance-asc">Distance ↑</option>
          </select>
        </div>
      </div>

      <div class="routes-grid" id="routesGrid">
        <!-- Populated by JS -->
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
